<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-label="Kin-Tracker v2.8.3 - Private Family Safety Radar and GPS Network">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="55%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#090d0c"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="82%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#14b8a6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="18%" cy="15%" r="42%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="380" rx="22" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="22" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="380" rx="22" fill="url(#cyanGlow)"/>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- Subtle Grid Texture -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="95" x2="1200" y2="95"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
  </g>

  <!-- Right Radar Visualization -->
  <g transform="translate(970, 190)">
    <circle r="155" fill="none" stroke="#10b981" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="112" fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle r="70" fill="#14b8a6" fill-opacity="0.06" stroke="#14b8a6" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle r="28" fill="#10b981" fill-opacity="0.20" stroke="#34d399" stroke-width="2"/>
    <line x1="-155" y1="0" x2="155" y2="0" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <path d="M 0 0 L 108 -108 A 152 152 0 0 1 152 0 Z" fill="#10b981" fill-opacity="0.16"/>

    <!-- Home Marker Center -->
    <circle cx="0" cy="0" r="8" fill="#10b981"/>
    <rect x="-32" y="14" width="64" height="22" rx="11" fill="#121215" stroke="#10b981" stroke-opacity="0.6" stroke-width="1"/>
    <text x="0" y="29" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700">HOME</text>

    <!-- Family Pin 1 -->
    <circle cx="-78" cy="-46" r="10" fill="#06b6d4" fill-opacity="0.25" stroke="#06b6d4" stroke-width="1.8"/>
    <circle cx="-78" cy="-46" r="4" fill="#22d3ee"/>
    <rect x="-126" y="-82" width="96" height="24" rx="12" fill="#121215" stroke="#06b6d4" stroke-opacity="0.55" stroke-width="1"/>
    <text x="-78" y="-66" text-anchor="middle" fill="#cffafe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700">ISABEL • 94%</text>

    <!-- Family Pin 2 -->
    <circle cx="72" cy="56" r="10" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="72" cy="56" r="4" fill="#fbbf24"/>
    <rect x="20" y="72" width="104" height="24" rx="12" fill="#121215" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1"/>
    <text x="72" y="88" text-anchor="middle" fill="#fef3c7" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700">ELOISE • 81%</text>
  </g>

  <!-- Left Content Column -->
  <!-- Status Badge -->
  <rect x="64" y="54" width="388" height="32" rx="16" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="84" cy="70" r="5" fill="#10b981"/>
  <text x="98" y="75" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0.8">v2.8.3 • ZERO DATA BROKERS • ANDROID 8.0+</text>

  <!-- Brand Headline -->
  <text x="64" y="152" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="60" font-weight="800" letter-spacing="-1.2">Kin-Tracker</text>
  <rect x="64" y="168" width="128" height="4" rx="2" fill="url(#accentLine)"/>

  <!-- Value Proposition -->
  <text x="64" y="210" fill="#e4e4e7" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600">Private, 24/7 Family Safety Radar &amp; Live Transit Network.</text>
  <text x="64" y="244" fill="#a1a1aa" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="400">Everything Life360 charges $180+/yr for — completely free, open-source, and</text>
  <text x="64" y="268" fill="#a1a1aa" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="400">self-hostable on your own server with zero tracking telemetry or paywalls.</text>

  <!-- Highlight Feature Pills -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">
    <rect x="64" y="298" width="166" height="36" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.2"/>
    <circle cx="82" cy="316" r="4" fill="#10b981"/>
    <text x="94" y="321" fill="#f4f4f5">Live #PIN Circle HUD</text>

    <rect x="242" y="298" width="194" height="36" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.2"/>
    <circle cx="260" cy="316" r="4" fill="#ef4444"/>
    <text x="272" y="321" fill="#f4f4f5">Find My Phone STOP UI</text>

    <rect x="448" y="298" width="178" height="36" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.2"/>
    <circle cx="466" cy="316" r="4" fill="#06b6d4"/>
    <text x="478" y="321" fill="#f4f4f5">Cloud Room Intercom</text>

    <rect x="638" y="298" width="168" height="36" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.2"/>
    <circle cx="656" cy="316" r="4" fill="#f59e0b"/>
    <text x="668" y="321" fill="#f4f4f5">Sovereign OTA &amp; VPS</text>
  </g>
</svg>
