<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" role="img" aria-label="Kin-Tracker UI Preview: Live Family Radar Map, Circle Switcher, and Find My Phone STOP Overlay">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="mapSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111518"/>
      <stop offset="100%" stop-color="#0b1012"/>
    </linearGradient>
    <linearGradient id="stopBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Outer Showcase Container -->
  <rect width="1200" height="500" rx="22" fill="url(#panelBg)"/>
  <rect x="1" y="1" width="1198" height="498" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- ================= LEFT PANEL: LIVE RADAR MAP ================= -->
  <rect x="28" y="28" width="560" height="444" rx="18" fill="url(#mapSurface)" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- Subtle Road Grid Lines inside Map -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <path d="M 48 160 L 210 195 L 390 140 L 568 180" fill="none"/>
    <path d="M 95 430 L 210 195 L 255 90" fill="none"/>
    <path d="M 350 440 L 390 140 L 450 92" fill="none"/>
    <path d="M 48 310 L 568 350" fill="none"/>
  </g>

  <!-- Top HUD Bar inside Radar Map -->
  <rect x="48" y="48" width="320" height="44" rx="22" fill="#121215" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
  <circle cx="72" cy="70" r="6" fill="#10b981"/>
  <text x="88" y="75" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Family Circle</text>
  <rect x="192" y="57" width="70" height="26" rx="13" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="227" y="74" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">#4666</text>
  <text x="278" y="75" fill="#a1a1aa" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">• 4 Online</text>

  <!-- Right Top Action Pill -->
  <rect x="466" y="48" width="102" height="44" rx="22" fill="#121215" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="517" y="75" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">LIVE GZIP</text>

  <!-- Safe Zone Geofence Circle 1: Home -->
  <circle cx="205" cy="240" r="76" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="205" cy="240" r="18" fill="#10b981"/>
  <text x="205" y="245" text-anchor="middle" fill="#052e16" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="800">H</text>
  <rect x="134" y="266" width="142" height="26" rx="8" fill="#09090b" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="205" y="283" text-anchor="middle" fill="#d1fae5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Home • 140m Zone</text>

  <!-- Family Member Pin on Route: Isabel -->
  <path d="M 205 240 Q 300 205 388 188" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="388" cy="188" r="20" fill="#06b6d4" fill-opacity="0.22" stroke="#22d3ee" stroke-width="2.2"/>
  <circle cx="388" cy="188" r="9" fill="#06b6d4"/>
  <rect x="318" y="216" width="140" height="44" rx="10" fill="#121215" stroke="#06b6d4" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="388" y="235" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Isabel • 14 mph</text>
  <text x="388" y="252" text-anchor="middle" fill="#67e8f9" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">Battery 94% • Transit</text>

  <!-- Family Member Pin 2: Eloise Tablet -->
  <circle cx="458" cy="316" r="18" fill="#f59e0b" fill-opacity="0.22" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="458" cy="316" r="8" fill="#f59e0b"/>
  <rect x="382" y="340" width="152" height="40" rx="10" fill="#121215" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="458" y="357" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700">eloise TAB • At School</text>
  <text x="458" y="373" text-anchor="middle" fill="#fde68a" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">Battery 81% • Charging</text>

  <!-- Bottom Quick Control Bar in Map -->
  <rect x="48" y="408" width="520" height="44" rx="12" fill="#121215" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.2"/>
  <text x="72" y="435" fill="#10b981" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Ghost Mode: Off</text>
  <line x1="196" y1="418" x2="196" y2="442" stroke="#27272a" stroke-width="1.5"/>
  <text x="214" y="435" fill="#e4e4e7" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Find My Phone</text>
  <line x1="328" y1="418" x2="328" y2="442" stroke="#27272a" stroke-width="1.5"/>
  <text x="346" y="435" fill="#06b6d4" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Room Audio</text>
  <line x1="444" y1="418" x2="444" y2="442" stroke="#27272a" stroke-width="1.5"/>
  <text x="462" y="435" fill="#a1a1aa" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Shopping (4)</text>

  <!-- ================= RIGHT COLUMN: SAFETY OVERLAYS & STATS ================= -->
  <!-- Card 1: Find My Phone STOP Overlay -->
  <rect x="612" y="28" width="560" height="176" rx="18" fill="#1a0d10" stroke="#ef4444" stroke-opacity="0.65" stroke-width="1.8"/>
  <circle cx="652" cy="68" r="14" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="652" cy="68" r="6" fill="#ef4444"/>
  <text x="678" y="65" fill="#fca5a5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800">FIND MY PHONE ACTIVE (RINGING OVERRIDE)</text>
  <text x="678" y="86" fill="#e4e4e7" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">Strict Device-UUID Verification — Only the targeted device rings</text>

  <rect x="638" y="108" width="508" height="72" rx="14" fill="url(#stopBtn)"/>
  <text x="892" y="146" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" letter-spacing="1.2">STOP RINGING ALARM</text>
  <text x="892" y="167" text-anchor="middle" fill="#fee2e2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">One tap silences audio immediately and clears cloud alarm state</text>

  <!-- Card 2: Current Circle Hero Card -->
  <rect x="612" y="220" width="560" height="122" rx="18" fill="#121215" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <text x="640" y="250" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">CURRENT CIRCLE • ONE-TAP SWITCHER</text>
  <text x="640" y="280" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="800">Family Circle</text>
  <text x="640" y="304" fill="#a1a1aa" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500">4 Verified Members  •  Sync Latency &lt; 250ms  •  Join PIN Feedback</text>
  <rect x="974" y="246" width="172" height="34" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="1060" y="268" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700">PIN: 4666 • ACTIVE</text>

  <!-- Card 3: Production Reliability Metrics -->
  <rect x="612" y="358" width="560" height="114" rx="18" fill="#121215" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <text x="640" y="388" fill="#06b6d4" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">v2.8.3 STABILITY &amp; PRIVACY GUARANTEES</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="640" y="422" fill="#ffffff" font-size="18" font-weight="800">0 Bytes Sold</text>
    <text x="640" y="444" fill="#a1a1aa" font-size="12">Self-hostable VPS</text>

    <line x1="794" y1="404" x2="794" y2="452" stroke="#27272a" stroke-width="1.5"/>

    <text x="816" y="422" fill="#34d399" font-size="18" font-weight="800">Zero-Loss DB</text>
    <text x="816" y="444" fill="#a1a1aa" font-size="12">Downgrade-safe Room</text>

    <line x1="984" y1="404" x2="984" y2="452" stroke="#27272a" stroke-width="1.5"/>

    <text x="1006" y="422" fill="#22d3ee" font-size="18" font-weight="800">77 Tests Pass</text>
    <text x="1006" y="444" fill="#a1a1aa" font-size="12">Auth Audio &amp; Sync</text>
  </g>
</svg>
