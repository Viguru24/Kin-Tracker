# ==============================================================================
# Kin-Tracker Sovereign Nginx Reverse Proxy Configuration (VPS)
# ==============================================================================

server {
    listen 80;
    server_name api.cosmowhisper.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.cosmowhisper.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/api.cosmowhisper.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.cosmowhisper.com/privkey.pem;

    client_max_body_size 20M;

    # 1. Main REST API & Dashboard
    location / {
        proxy_pass http://127.0.0.1:4666;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Sovereign Low-Latency Audio Relay (WebSocket)
    location /audio {
        proxy_pass http://127.0.0.1:4666/audio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
